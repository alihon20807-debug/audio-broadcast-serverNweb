<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SyncAmp — Precision synchronized audio playback across devices">
    <meta name="theme-color" content="#020617">

    <title>Precision Sync Player</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔊</text></svg>">
    
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    
    <main id="app-container" class="app-container" role="main">
        <div class="top-accent"></div>
        
        <header id="app-header">
            <div id="brand-container" class="brand">
                <h1 id="app-title">SYNC<span>AMP</span></h1>
                <p id="app-subtitle">PRECISION AUDIO BROADCAST</p>
            </div>
            <div id="status-container" class="status-area" role="status" aria-live="polite">
                <div id="status-pill" class="status-pill">
                    <div id="status-dot" class="status-dot slate" aria-hidden="true"></div>
                    <span id="status-text" class="status-text">Hardware Offline</span>
                </div>
                <div id="client-badge" class="client-badge hidden">
                    <span id="client-count" class="client-count">1 Client</span>
                </div>
            </div>
        </header>
        
        <section id="content-stack">
            <div id="metrics-bar" class="metrics-panel">
                <div id="precision-metric" class="metric-item">
                    <p class="metric-label" id="precision-label">Sync Precision</p>
                    <p id="offset-display" class="metric-value" aria-labelledby="precision-label">---</p>
                </div>
                <div id="latency-metric" class="metric-item">
                    <p class="metric-label" id="latency-label">Latency</p>
                    <p id="latency-display" class="metric-value" aria-labelledby="latency-label">---</p>
                </div>
            </div>
            
            <div id="controls-container" class="controls-stack">
                <button id="main-btn" class="btn btn-primary" aria-label="Start synchronized playback">
                    Start System
                </button>
                <button id="stop-btn" class="btn btn-secondary" aria-label="Stop all playback">
                    Stop All
                </button>
            </div>
            
            <div id="settings-panel" class="settings-panel">
                <div id="delay-setting" class="setting-group">
                    <label id="delay-label" for="play-delay" class="setting-label">Start-up Buffer Delay</label>
                    <input type="range" id="play-delay" min="500" max="8000" value="5000" step="100" 
                    aria-valuemin="500" aria-valuemax="8000" aria-valuenow="5000">
                    <div class="range-marks">
                        <span>500ms</span>
                        <span id="play-delay-val" class="range-current">5000ms</span>
                        <span>8000ms</span>
                    </div>
                </div>
                
                <div id="calibration-setting" class="setting-group">
                    <label id="calibration-label" for="fine-tune" class="setting-label">Acoustic Auto-Calibration</label>
                    <input type="range" id="fine-tune" min="-100" max="100" value="0" step="1" 
                    aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0">
                    <div class="range-marks">
                        <span>-100ms</span>
                        <span id="fine-tune-val" class="range-current">0ms</span>
                        <span>+100ms</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <script src="{{ url_for('static', filename='js/socket.io.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='js/main.js') }}?v=2"></script>
</body>
</html>
