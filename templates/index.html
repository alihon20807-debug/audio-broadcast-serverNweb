<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SyncAmp — Precision synchronized audio playback across devices">
    <meta name="theme-color" content="#020617">
    <title>Precision Sync Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glow { box-shadow: 0 0 20px rgba(99, 102, 241, 0.4); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6 font-sans">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>
        
        <header class="mb-6">
            <h1 class="text-3xl font-black tracking-tight text-white mb-1">SYNC<span class="text-indigo-500">AMP</span></h1>
            <div class="flex items-center gap-2">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-slate-600 animate-pulse"></div>
                <p id="status" class="text-slate-500 text-[10px] uppercase font-bold tracking-widest">Hardware Offline</p>
            </div>
        </header>

        <div class="flex flex-col gap-6">
            <div class="flex items-center justify-between bg-slate-800/50 p-4 rounded-2xl border border-slate-700/50">
                <div>
                    <p class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">Sync Precision</p>
                    <p id="offsetDisplay" class="text-xl font-mono text-indigo-400">---</p>
                </div>
                <div class="text-right">
                    <p class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">Latency</p>
                    <p id="latencyDisplay" class="text-xl font-mono text-emerald-400">---</p>
                </div>
            </div>

            <div class="space-y-3">
                <button onclick="initAndPlay()" id="mainBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-2xl font-bold text-lg transition-all active:scale-[0.98] glow">
                    Start System
                </button>
                <button onclick="stopPlayback()" id="stopBtn" class="w-full bg-slate-800 hover:bg-slate-700 py-3 rounded-2xl font-semibold text-slate-300 transition-all">
                    Stop All
                </button>
            </div>
            
            <div class="pt-4 border-t border-slate-800 space-y-4">
                <div>
                    <p class="text-[10px] text-slate-600 uppercase text-center font-bold tracking-widest">Start-up Buffer Delay</p>
                    <input type="range" id="playDelay" min="500" max="8000" value="5000" step="100" 
                           class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500 mt-2">
                    <div class="flex justify-between text-[10px] text-slate-700 mt-1 font-mono">
                        <span>500ms</span>
                        <span id="playDelayVal">5000ms</span>
                        <span>8000ms</span>
                    </div>
                </div>
                
                <div>
                    <p class="text-[10px] text-slate-600 uppercase text-center font-bold tracking-widest">Acoustic Auto-Calibration</p>
                    <input type="range" id="fineTune" min="-100" max="100" value="0" step="1" 
                           class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500 mt-2">
                    <div class="flex justify-between text-[10px] text-slate-700 mt-1 font-mono">
                        <span>-100ms</span>
                        <span id="fineTuneVal">0ms</span>
                        <span>+100ms</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Bug #16: Connection-guarded stop function
        function stopPlayback() {
            if (socket && socket.connected) {
                socket.emit('request_stop');
            } else {
                document.getElementById('status').innerText = 'Not connected';
            }
        }
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
